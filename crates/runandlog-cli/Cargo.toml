[package]
name = "runandlog-cli"
description = "Markdown 内のシェルコマンドを実行して結果を書き戻す CLI / TUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "runandlog"
path = "src/main.rs"

[dependencies]
runandlog-core.workspace = true
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
