<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run and Log</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="path" id="path" title="">Loading…</div>
      <div class="actions">
        <button id="run-all" type="button">Run all</button>
        <button id="stop" type="button" disabled>Stop</button>
        <button id="reload" type="button">Reload</button>
      </div>
    </header>

    <div class="find" id="find" role="search" hidden>
      <input
        id="find-input"
        type="text"
        placeholder="Find"
        aria-label="Find in the document"
        autocomplete="off"
        spellcheck="false"
      />
      <span class="find-count" id="find-count" aria-live="polite"></span>
      <button id="find-prev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
      <button id="find-next" type="button" title="Next match (Enter)" aria-label="Next match">↓</button>
      <button id="find-close" type="button" title="Close (Esc)" aria-label="Close">✕</button>
    </div>

    <main id="cells" class="cells"></main>

    <footer class="status" id="status">Ready.</footer>

    <dialog id="password" class="password">
      <form id="password-form">
        <label id="password-prompt" for="password-input"></label>
        <input id="password-input" type="password" autocomplete="off" spellcheck="false" />
        <div class="password-actions">
          <button id="password-decline" type="button">Cancel</button>
          <button id="password-send" type="submit">Send</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
