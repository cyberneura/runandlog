[workspace]
members = ["crates/runandlog-core", "crates/runandlog-cli"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cyberneura/runandlog"

[workspace.dependencies]
# The version is here for crates.io: a path dependency with no version cannot be
# published. scripts/release.sh keeps it in step with the workspace version.
runandlog-core = { path = "crates/runandlog-core", version = "0.3.1" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
