# cargo-about settings, read by scripts/generate-third-party-notices.sh.
#
# Only what ends up in a shipped binary is listed: build-time and test-time
# dependencies are left out. The targets are not set here: the two release
# builds differ in their features as well as their target, so the script runs
# cargo-about once per build and passes both on the command line.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
